[platformio]
default_envs = tab5_p4

[common]
framework = arduino
monitor_speed = 115200
build_unflags =
    -D LV_USE_FREETYPE
build_flags =
    -D ARDUINO_LOCALE_EN
    -D TAB5_LOG_ENABLED=1
    -D LV_CONF_INCLUDE_SIMPLE
    -DLV_CONF_PATH=\"${PROJECT_SRC_DIR}/lv_conf.h\"
    -D LV_USE_LOG=0
lib_deps =
    m5stack/M5Unified@0.2.19
    m5stack/M5GFX@0.2.26
    lvgl/lvgl@9.3.0

[env:tab5_p4]
; Exact upstream release. G0 records the archive SHA-256 and resolved package
; URLs/checksums; no machine-local vendor directory participates in the build.
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework     = arduino, espidf
board         = esp32-p4-evboard
board_build.flash_mode = qio
upload_speed = 1500000
monitor_speed = ${common.monitor_speed}
extra_scripts = pre:scripts/add_tab5_toolchain.py, pre:scripts/patch_tab5_framework.py, pre:scripts/patch_m5gfx_dsi_double_buffer.py, pre:scripts/filter_p4_wifi_remote_archive.py, pre:scripts/disable_lvgl_helium.py, post:scripts/strip_extra_flash_images.py
build_flags   =
    ${common.build_flags}
    -D CORE_P4=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -I$PROJECT_SRC_DIR
    -I$PROJECT_INCLUDE_DIR
    -DCONFIG_ESP_HOSTED_SDIO_HOST_INTERFACE=1
    -DCONFIG_ESP_HOSTED_SDIO_OPTIMIZATION_RX_STREAMING_MODE=1
    -DCONFIG_ESP_HOSTED_SDIO_SLOT_1=1
    -DCONFIG_ESP_HOSTED_SDIO_SLOT=1
    -DCONFIG_ESP_HOSTED_SDIO_BUS_WIDTH=4
    -DCONFIG_ESP_HOSTED_SDIO_CLOCK_FREQ_KHZ=40000
    -DCONFIG_ESP_HOSTED_SDIO_PIN_CLK=12
    -DCONFIG_ESP_HOSTED_SDIO_PIN_CMD=13
    -DCONFIG_ESP_HOSTED_SDIO_PIN_D0=11
    -DCONFIG_ESP_HOSTED_SDIO_PIN_D1=10
    -DCONFIG_ESP_HOSTED_SDIO_PIN_D2=9
    -DCONFIG_ESP_HOSTED_SDIO_PIN_D3=8
    -DCONFIG_ESP_HOSTED_GPIO_SLAVE_RESET_SLAVE=15
    -DCONFIG_ESP_HOSTED_ENABLE_BT_NIMBLE=1
    -DCONFIG_ESP_HOSTED_NIMBLE_HCI_VHCI=1
    -DCONFIG_ESP_SDIO_PIN_CLK=12
    -DCONFIG_ESP_SDIO_PIN_CMD=13
    -DCONFIG_ESP_SDIO_PIN_D0=11
    -DCONFIG_ESP_SDIO_PIN_D1=10
    -DCONFIG_ESP_SDIO_PIN_D2=9
    -DCONFIG_ESP_SDIO_PIN_D3=8
    -DCONFIG_ESP_SDIO_GPIO_RESET_SLAVE=15
    -DCONFIG_ESP_WIFI_ESPNOW_MAX_ENCRYPT_NUM=7
    -DCONFIG_WIFI_RMT_STATIC_RX_BUFFER_NUM=10
    -DCONFIG_WIFI_RMT_DYNAMIC_RX_BUFFER_NUM=32
    -DCONFIG_WIFI_RMT_TX_BUFFER_TYPE=1
    -DCONFIG_WIFI_RMT_DYNAMIC_RX_MGMT_BUF=0
    -DCONFIG_WIFI_RMT_ESPNOW_MAX_ENCRYPT_NUM=7
    -DLV_USE_DRAW_SW_HELIUM=0
    -DLV_CONF_PATH=\"${PROJECT_SRC_DIR}/lv_conf.h\"
    -D CORE_DEBUG_LEVEL=2
    ; Production invariants: per-command HCI and per-value diagnostics are off.
    -DTAB5_PRODUCTION_BUILD=1
    -DTAB5_HCI_PATH_DIAG=0
    -DTAB5_BLE_VERBOSE_DIAG=0
    ; H0 wire-contract wraps against prebuilt esp_hosted 2.0.13
    -Wl,--wrap=esp_hosted_tx
    -Wl,--wrap=process_capabilities
    -Wl,--wrap=print_capabilities
    -Wl,--wrap=serial_rx_handler
lib_deps      =
    ${common.lib_deps}
platform_packages =
    ; The device-proven local framework is the official 3.3.1 source plus the
    ; two-line P4 soft-AP guard applied by patch_tab5_framework.py.
    framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.1/esp32-3.3.1.zip
    framework-arduinoespressif32-libs@https://github.com/espressif/esp32-arduino-lib-builder/releases/download/idf-release_v5.4/esp32-arduino-libs-idf-release_v5.4-858a988d-v1.zip
build_src_filter =
    +<*>
    ; Product RF_PTH driver (Lightwave WiFiAntenna). Additive on the UI tip.
    +<network/WiFiAntenna.cpp>
    -<diag/>
    -<fonts/countach_bolditalic_40.c>
    -<fonts/countach_bolditalic_89.c>
board_build.partitions = partitions/huge_app.csv
board_upload.flash_size = 16MB

; ---------------------------------------------------------------------------
; Non-shippable HCI diagnostic environment. Production stays default and quiet.
; ---------------------------------------------------------------------------
[env:tab5_p4_hci_diag]
extends = env:tab5_p4
build_flags =
    ${env:tab5_p4.build_flags}
    -UTAB5_PRODUCTION_BUILD
    -UTAB5_HCI_PATH_DIAG
    -UTAB5_BLE_VERBOSE_DIAG
    -DTAB5_HCI_PATH_DIAG=1
    -DTAB5_BLE_VERBOSE_DIAG=1
    -DTAB5_PRODUCTION_BUILD=0
    -DTAB5_NON_SHIPPABLE_DIAGNOSTIC=1

; ---------------------------------------------------------------------------
; Native SDL simulator for Operator MAIN (deck_ui) — desktop, no device.
;
; Compiles the SAME deck_ui/deck_state/deck_input/deck_tx translation units the
; Tab5 flashes, against LVGL 9.3.0's SDL backend at the panel's 1280x720 RGB565.
; Device-only sources (main.cpp, lvgl_bridge, ble_midi_transport, hosted_*, net,
; M5, diag, dsp_widgets) are filtered out and replaced by host stubs under
; simulator/stubs, so this environment cannot perturb tab5_p4.
;
; Deviations from the device build live in simulator/lv_conf.h and are annotated
; there — chiefly LV_COLOR_16_SWAP 0 (SDL, PPA and the DSI framebuffer all
; consume native-endian RGB565) and LV_USE_OS LV_OS_NONE.
;
; Run:  pio run -e native_sdl -t exec
;   or  .pio/build/native_sdl/program --linked
; ---------------------------------------------------------------------------
[env:native_sdl]
platform = native@1.2.1
build_type = debug
lib_deps = lvgl/lvgl@9.3.0
lib_ldf_mode = off
build_flags =
    -std=gnu++17
    -arch arm64
    -O1
    -g
    -Wno-unused-variable
    -DSIMULATOR=1
    -DDECK_UI_NATIVE_SIM=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_CONF_PATH=\"${PROJECT_DIR}/simulator/lv_conf.h\"
    -I$PROJECT_DIR/simulator
    -I$PROJECT_DIR/simulator/stubs
    -I$PROJECT_SRC_DIR
    -I$PROJECT_INCLUDE_DIR
    -I/opt/homebrew/include
    -I/opt/homebrew/include/SDL2
    -L/opt/homebrew/lib
    -lSDL2
build_src_filter =
    -<*>
    +<deck_ui.cpp>
    +<palette_flow.cpp>
    +<deck_ui_layout_map.cpp>
    +<deck_ui_sheets.cpp>
    +<deck_state.cpp>
    +<deck_input.cpp>
    +<deck_tx.cpp>
    +<deck_latency.cpp>
    +<fonts/berkeley_mono_21.c>
    +<fonts/berkeley_mono_24.c>
    +<fonts/berkeley_mono_34.c>
    +<fonts/berkeley_mono_55.c>
    +<fonts/countach_bolditalic_55.c>
    +<../simulator/main.cpp>
    +<../simulator/sim_arduino.cpp>
    +<../simulator/sim_ble_midi_transport.cpp>
    +<../simulator/sim_png.cpp>
    +<../simulator/sim_bounds_dump.cpp>
    +<../simulator/sim_deck_state_rx.cpp>
