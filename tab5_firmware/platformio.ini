[platformio]
default_envs = tab5_p4

[common]
framework = arduino
monitor_speed = 115200
build_unflags =
    -D LV_USE_FREETYPE
build_flags =
    -D ARDUINO_LOCALE_EN
    -D TAB5_LOG_ENABLED=1
    -D LV_CONF_INCLUDE_SIMPLE
    -DLV_CONF_PATH=\"${PROJECT_SRC_DIR}/lv_conf.h\"
    -D LV_USE_LOG=0
lib_deps =
    # Pin external libs used at runtime
    m5stack/M5Unified
    m5stack/M5GFX
    # Phase B: pin LVGL (was ^9.3.0). PPA behind TAB5_USE_PPA=0 escape hatch —
    # do not enable until device A/B vs this pin on the Tab5 panel.
    lvgl/lvgl@9.3.0

[env:tab5_s3]
platform      = espressif32
board         = m5stack-coreS3
framework     = arduino, espidf
monitor_speed = ${common.monitor_speed}
build_flags   =
    ${common.build_flags}
    -D CORE_S3=1
    -I$PROJECT_SRC_DIR
    -I$PROJECT_INCLUDE_DIR
lib_deps      = ${common.lib_deps}
extra_scripts = pre:scripts/add_tab5_toolchain.py, pre:scripts/disable_lvgl_helium.py
build_src_filter =
    +<*>
    -<diag/>
    -<fonts/countach_bolditalic_40.c>
    -<fonts/countach_bolditalic_89.c>
platform_packages =
  tool-esptoolpy@file://vendor/pio_packages/tool-esptoolpy

[env:tab5_p4]
; Pinned to the repo-vendored P4 platform recorded in build.log.
platform      = file://vendor/pio_platforms/espressif32
framework     = arduino, espidf
board         = esp32-p4-evboard
board_build.flash_mode = qio
upload_speed = 1500000
monitor_speed = ${common.monitor_speed}
extra_scripts = pre:scripts/prepare_hosted_14x_ab.py, pre:scripts/add_tab5_toolchain.py, pre:scripts/filter_p4_wifi_remote_archive.py, pre:scripts/disable_lvgl_helium.py, post:scripts/strip_extra_flash_images.py
build_flags   =
    ${common.build_flags}
    -D CORE_P4=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -I$PROJECT_SRC_DIR
    -I$PROJECT_INCLUDE_DIR
    -DCONFIG_ESP_HOSTED_SDIO_HOST_INTERFACE=1
    -DCONFIG_ESP_HOSTED_SDIO_OPTIMIZATION_RX_STREAMING_MODE=1
    -DCONFIG_ESP_HOSTED_SDIO_SLOT_1=1
    -DCONFIG_ESP_HOSTED_SDIO_SLOT=1
    -DCONFIG_ESP_HOSTED_SDIO_BUS_WIDTH=4
    -DCONFIG_ESP_HOSTED_SDIO_CLOCK_FREQ_KHZ=40000
    -DCONFIG_ESP_HOSTED_SDIO_PIN_CLK=12
    -DCONFIG_ESP_HOSTED_SDIO_PIN_CMD=13
    -DCONFIG_ESP_HOSTED_SDIO_PIN_D0=11
    -DCONFIG_ESP_HOSTED_SDIO_PIN_D1=10
    -DCONFIG_ESP_HOSTED_SDIO_PIN_D2=9
    -DCONFIG_ESP_HOSTED_SDIO_PIN_D3=8
    -DCONFIG_ESP_HOSTED_GPIO_SLAVE_RESET_SLAVE=15
    -DCONFIG_ESP_HOSTED_ENABLE_BT_NIMBLE=1
    -DCONFIG_ESP_HOSTED_NIMBLE_HCI_VHCI=1
    -DCONFIG_ESP_SDIO_PIN_CLK=12
    -DCONFIG_ESP_SDIO_PIN_CMD=13
    -DCONFIG_ESP_SDIO_PIN_D0=11
    -DCONFIG_ESP_SDIO_PIN_D1=10
    -DCONFIG_ESP_SDIO_PIN_D2=9
    -DCONFIG_ESP_SDIO_PIN_D3=8
    -DCONFIG_ESP_SDIO_GPIO_RESET_SLAVE=15
    -DCONFIG_ESP_WIFI_ESPNOW_MAX_ENCRYPT_NUM=7
    -DCONFIG_WIFI_RMT_STATIC_RX_BUFFER_NUM=10
    -DCONFIG_WIFI_RMT_DYNAMIC_RX_BUFFER_NUM=32
    -DCONFIG_WIFI_RMT_TX_BUFFER_TYPE=1
    -DCONFIG_WIFI_RMT_DYNAMIC_RX_MGMT_BUF=0
    -DCONFIG_WIFI_RMT_ESPNOW_MAX_ENCRYPT_NUM=7
    -DLV_USE_DRAW_SW_HELIUM=0
    -DLV_CONF_PATH=\"${PROJECT_SRC_DIR}/lv_conf.h\"
    -D CORE_DEBUG_LEVEL=2
    ; HCI path diagnosis (Captain 2026-08-07). Keep 1 while undiagnosed; set 0 to quiet.
    -DTAB5_HCI_PATH_DIAG=1
    ; H0 wire-contract wraps against prebuilt esp_hosted 2.0.13
    -Wl,--wrap=esp_hosted_tx
    -Wl,--wrap=process_capabilities
    -Wl,--wrap=print_capabilities
    -Wl,--wrap=serial_rx_handler
lib_deps      =
    ${common.lib_deps}
platform_packages =
    framework-arduinoespressif32@file://vendor/pio_packages/framework-arduinoespressif32
    framework-arduinoespressif32-libs@file://vendor/pio_packages/framework-arduinoespressif32-libs
    toolchain-riscv32-esp@file://vendor/pio_packages/toolchain-riscv32-esp
    toolchain-xtensa-esp-elf@file://vendor/pio_packages/toolchain-xtensa-esp-elf
    toolchain-esp32ulp@file://vendor/pio_packages/toolchain-esp32ulp
    tool-cmake@file://vendor/pio_packages/tool-cmake
    tool-esptoolpy@file://vendor/pio_packages/tool-esptoolpy
    tool-riscv32-esp-elf-gdb@file://vendor/pio_packages/tool-riscv32-esp-elf-gdb
    tl-install@file://vendor/pio_packages/tl-install
build_src_filter =
    +<*>
    -<diag/>
    -<fonts/countach_bolditalic_40.c>
    -<fonts/countach_bolditalic_89.c>
board_build.partitions = partitions/huge_app.csv
board_upload.flash_size = 16MB

; ---------------------------------------------------------------------------
; A/B: P4 host against M5 factory ESP-Hosted 1.4.0 (C6 stays on live 1.4.1).
; Recoverable: vendor libs remain 2.0.13; see vendor/esp_hosted_ab/REVERT.md.
; Do NOT flash C6 from this env. Flash P4 only after MAC identity check.
; ---------------------------------------------------------------------------
[env:tab5_p4_hosted_14x]
extends = env:tab5_p4
extra_scripts =
    pre:scripts/prepare_hosted_14x_ab.py
    pre:scripts/add_tab5_toolchain.py
    pre:scripts/filter_p4_wifi_remote_archive.py
    pre:scripts/disable_lvgl_helium.py
    post:scripts/strip_extra_flash_images.py
custom_sdkconfig =
    ; intentionally empty — AB uses seeded sdkconfig.tab5_p4_hosted_14x
    ; (do not rewrite shared sdkconfig.defaults)
build_flags =
    ${env:tab5_p4.build_flags}
    -DTAB5_HOSTED_AB_VERSION=10400
    -DTAB5_HOSTED_AB_TAG=\"1.4.0\"

; ---------------------------------------------------------------------------
; Native SDL simulator for Operator MAIN (deck_ui) — desktop, no device.
;
; Compiles the SAME deck_ui/deck_state/deck_input/deck_tx translation units the
; Tab5 flashes, against LVGL 9.3.0's SDL backend at the panel's 1280x720 RGB565.
; Device-only sources (main.cpp, lvgl_bridge, ble_midi_transport, hosted_*, net,
; M5, diag, dsp_widgets) are filtered out and replaced by host stubs under
; simulator/stubs, so this environment cannot perturb tab5_p4.
;
; Deviations from the device build live in simulator/lv_conf.h and are annotated
; there — chiefly LV_COLOR_16_SWAP 0 (SDL wants native-endian RGB565; M5GFX
; wants the swap) and LV_USE_OS LV_OS_NONE.
;
; Run:  pio run -e native_sdl -t exec
;   or  .pio/build/native_sdl/program --linked
; ---------------------------------------------------------------------------
[env:native_sdl]
platform = native
build_type = debug
lib_deps = lvgl/lvgl@9.3.0
lib_ldf_mode = off
build_flags =
    -std=gnu++17
    -arch arm64
    -O1
    -g
    -Wno-unused-variable
    -DSIMULATOR=1
    -DDECK_UI_NATIVE_SIM=1
    -DLV_CONF_INCLUDE_SIMPLE
    -DLV_CONF_PATH=\"${PROJECT_DIR}/simulator/lv_conf.h\"
    -I$PROJECT_DIR/simulator
    -I$PROJECT_DIR/simulator/stubs
    -I$PROJECT_SRC_DIR
    -I$PROJECT_INCLUDE_DIR
    -I/opt/homebrew/include
    -I/opt/homebrew/include/SDL2
    -L/opt/homebrew/lib
    -lSDL2
build_src_filter =
    -<*>
    +<deck_ui.cpp>
    +<deck_ui_layout_map.cpp>
    +<deck_ui_sheets.cpp>
    +<deck_state.cpp>
    +<deck_input.cpp>
    +<deck_tx.cpp>
    +<deck_latency.cpp>
    +<fonts/berkeley_mono_21.c>
    +<fonts/berkeley_mono_24.c>
    +<fonts/berkeley_mono_34.c>
    +<fonts/berkeley_mono_55.c>
    +<fonts/countach_bolditalic_55.c>
    +<../simulator/main.cpp>
    +<../simulator/sim_arduino.cpp>
    +<../simulator/sim_ble_midi_transport.cpp>
    +<../simulator/sim_png.cpp>
    +<../simulator/sim_bounds_dump.cpp>
    +<../simulator/sim_deck_state_rx.cpp>

[env:diag_display]
platform      = espressif32
board         = esp32-p4-evboard
framework     = ${common.framework}
monitor_speed = ${common.monitor_speed}
build_flags   =
    ${common.build_flags}
    -D CORE_P4=1
    -D TAB5_DIAG_DISPLAY=1
build_src_filter =
    +<src/diag/>
    -<src/>
