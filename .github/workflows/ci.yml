name: CI

# Phase F / L0 — machine-verifiable gate. Makes "green" reproducible off any
# single machine (audit Critical: the host gate was previously local-only).
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-regression:
    name: Host regression + golden gate + Gate Fα
    runs-on: ubuntu-latest
    steps:
      # fetch-depth >= 2 so dual-sync F2 oracle can resolve HEAD^ (ancestor
      # contract). Default shallow depth-1 checkout fails
      # test_f2_firmware_sha_is_separate_ancestor_of_harness_head.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host tools (clang = DSP oracle, ffmpeg = AV loudness fixtures)
        run: sudo apt-get update && sudo apt-get install -y clang ffmpeg
      - name: Install Python deps
        run: pip install -r requirements-dev.txt
      - name: Golden-master behaviour gate + harness self-test (Gate Fα)
        run: python -m pytest tests/test_golden_master.py tests/test_harness_selftest.py -q
      - name: Full host regression suite
        run: python -m pytest tests/ -q

  firmware-build:
    # Build BOTH firmware envs. k1_hardware IS default_envs (platformio.ini:15 — the
    # shipping build); k1_prod_im73d is the IM73D-mic production variant that extends
    # k1_hardware. CI builds both so it guards the shipping binary and the IM73D
    # variant. NOTE: CI is the COMMITTED enforcement gate — it runs on every push
    # regardless of local git hooks. The local pre-commit gate (scripts/hooks) is a
    # per-clone fast-feedback convenience activated by scripts/hooks/install.sh; git
    # deliberately will not auto-run hooks on a fresh clone, so CI is the backstop.
    name: Firmware build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [k1_hardware, k1_prod_im73d]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}
