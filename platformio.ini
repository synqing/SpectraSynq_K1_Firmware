; PIO-MIGRATION (2026-05-24): K1 firmware build moved arduino-cli → PlatformIO.
;
; What:  this file replaces tools/compile-k1-arduino.sh as the canonical K1 build.
;        Targets pioarduino 54.03.20 = arduino-esp32 3.2.0 / ESP-IDF 5.4.1 and
;        FastLED 3.10.3 from lib_deps (vendored 3.9.16 retired).
; Why:   arduino-esp32 3.x deprecates the legacy I2S driver this firmware was
;        built against; the K1 hardware also needs the full N16R8 flash budget
;        (16 MB, currently under-provisioned at 8 MB).
; How:   see docs/forensics/2026-05-24-doctrine-gate-pio-migration.md (gate)
;        and MIGRATION_PLAN-v2-rebaselined.md (plan).
; Rollback: tag pre-pio-migration-20260524-1320 (SHA in /tmp/rollback_tag.txt).
; Scope: build tooling + I2S driver only. No DSP / visual / sample-rate change.

[platformio]
default_envs = k1_prod_im73d
src_dir = SPECTRASYNQ_K1_FIRMWARE

[env:k1_hardware]
; Legacy SPH0645-compatible base environment. It remains the shared production-feature
; flag/GPIO base for derived environments, but it is not the shipping microphone
; authority after Captain's 2026-07-15 IM73D production decision.
; pioarduino tag 54.03.20 ≡ arduino-esp32 3.2.0 (FastLED's blessed pinning for S3).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board    = esp32-s3-devkitc1-n16r8
framework = arduino

; OPI PSRAM — both knobs required; flash size = full N16R8 budget.
board_build.arduino.memory_type = qio_opi
board_build.psram_type          = opi
board_build.flash_mode          = qio
board_build.flash_size          = 16MB
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv

; BT-11: classic-Arduino layout — the .ino enters compile.
; PIO preprocesses the .ino in place to <Sketch>.ino.cpp inside src_dir, so the
; filter must accept both the source .ino and the conversion output; otherwise
; PIO emits "Error: Nothing to build" (observed 2026-05-24 with PIO 6.1.19).
; PIO-SPIKE2 (2026-05-25): globals_config.cpp added — first hand-written .cpp TU,
; holding the relocated aggregate-init data (CONFIG, CONFIG_DEFAULTS,
; a_weight_table). This is now a TWO-TU build. Byte-identity of the relocated
; initialisers is proven in docs/k1-refactor-2026-05/spike2/.
; Phase 1 restructure (2026-06-03): sources moved into functional subdirs
; (docs/refactor/k1-firmware-restructure-and-rebrand-plan.md). The .ino stays at
; src_dir root; compiled .cpp now live under their subdirs. Subdir include paths
; are added by scripts/platformio/k1_src_includes.py (CPPPATH, space-safe).
build_src_filter = +<*.ino> +<*.ino.cpp> +<system/globals_config.cpp> +<system/globals.cpp> +<visual/Palettes.cpp> +<visual/render_params.cpp> +<effects/light_mode_*.cpp> +<audio/k1_*.cpp> +<director/k1_*.cpp> +<control/k1_*.cpp> +<serial/*.cpp>

monitor_speed = 115200
upload_speed  = 921600
; K1_UPLOAD_GUARD (2026-06-01): this env is the default GPIO pin map and belongs
; on the main K1 only: /dev/tty.usbmodem1401, USB serial
; B4:3A:45:A5:87:F8, chip F887A500. The pre-upload guard below refuses a
; mismatched port/USB serial before firmware is written.
upload_port   = /dev/tty.usbmodem1401
monitor_port  = /dev/tty.usbmodem1401
extra_scripts =
    pre:scripts/platformio/k1_src_includes.py
    pre:scripts/platformio/k1_upload_guard.py
    pre:scripts/platformio/k1_build_provenance.py

build_unflags =
    -DARDUINO_RUNNING_CORE=1

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_RUNNING_CORE=0
    -DBOARD_HAS_PSRAM
    -DK1_HARDWARE
    -DK1_LED_TASK_CORE=1
    ; N3 (2026-06-27): the Tab5 wireless control-token macro K1_CONTROL_TOKEN was
    ; scrubbed from production and is now defined ONLY in env:k1_wireless_ab_probe
    ; (the sole wireless-enabled bench build, the only env that links the wireless
    ; control source). It had no consumer here and was already dead-stripped, so the
    ; production binary stays byte-identical. See tests/test_token_scrub_static.py.
    -DK1_I2S_DMA_DESC_NUM_VALUE=3
    -DDEFAULT_SAMPLE_RATE=12800
    -DDEFAULT_SAMPLES_PER_CHUNK=96
    -DK1_TEMPO_NOVELTY_DECIMATION=3U
    ; K1 response profile (2026-06-18): unity post-DC AC-domain gain.
    ; Live 55 dB-A paired AP capture showed the former main-only 3.0x gain
    ; drove normal playback into AGC floor-pin against the bench reference.
    -DDEFAULT_AUDIO_RESPONSE_GAIN=1.0f
    -DESP32_ARDUINO_NO_RGB_BUILTIN
    -O3
    -ffast-math
    -Wno-deprecated-declarations
    -Wno-narrowing
    ; ── Audio semantic forward-graft promotion (2026-06-05) ───────────────────
    ;   Full evidence + per-flag device impact:
    ;   docs/forensics/tempo_tracking_refactor/2026-06-05-audio-semantic-forward-graft.md
    ;   HOST-validated (pytest 136; before/after metrics; all configs xtensa-green).
    ;   DEVICE eyes-on is the one remaining gate. Legacy paths live under the
    ;   matching #ifndef K1_*_V2 — REVERT = delete the 5 -D lines below.
    -DK1_TEMPO_CONF_V2       ; stable prominence/periodicity confidence + lock FSM (was: peak2/sum floor)
    -DK1_TEMPO_FLYWHEEL_V2   ; PLL beat phase + 3x beat-tick republish bug fix
    -DK1_ONSET_V2            ; donor log-flux/median-adaptive/per-band onset + channels (ON-02)
    -DK1_CHORD_V2            ; ChordState + revived harmonic saliency
    -DK1_SEMANTIC_STATE      ; AudioSemanticState read-surface (inert until a consumer exists)
    ; ── Tier 1 consumers (2026-06-11, hardened re-run) ─────────────────────────
    ;   Recon: _scratch/fix-investigation/window-audit/08-tier1-chord-recon.md
    ;   (chord conf 98.4% ≥0.70 on real material; held-root 0.83 changes/s).
    ;   REVERT = delete the -D line below; off-flag is byte-identical.
    -DK1_CHORD_HUE_V1        ; Dense Forge chord→hue anchor (first chord consumer; hue-only)
    ; ── Impact lane (2026-06-11, Captain-directed items 3-7) ──────────────────
    ;   DROP-CUT: musical silence cuts go ACTUALLY dark in ~200 ms (120 ms
    ;   confirm + 80 ms ramp), relight instant. Strobe-safe: hysteresis +
    ;   sustained-quiet + recent-loud requirement + 1 s re-arm. Fail-open.
    -DK1_DROP_CUT_V1
    ;   ATTACK SNAP: asymmetric waveform_peak_scaled envelope (rise 0.65 /
    ;   fall 0.15, was symmetric 0.25) — transients land in ~1-2 AP frames,
    ;   trails keep their grace. REVERT = delete either -D line.
    -DK1_PEAK_ASYM_ENV
    ; ── LGP vivid pre-comp test (2026-06-17) ─────────────────────────────────
    ;   Runtime output-stage chroma expansion for sealed-LGP A/B only.
    ;   Default OFF via VP_VIVID_PRECOMP=false. REVERT = delete this -D line.
    -DK1_VIVID_PRECOMP_V1
    ; ── K1 loud-room guard test (2026-06-17) ─────────────────────────────────
    ;   Runtime AP headroom + semantic trim. Ships ENABLED: k1_loud_guard_enabled
    ;   defaults TRUE (globals.h) — this comment previously claimed OFF (stale, fixed
    ;   2026-07-10 per AP audit). Release/floor-cut retune: default mode 2 (0.80 s +
    ;   hybrid affine cut, hardware-validated 2026-07-10); modes 0/1 runtime-selectable
    ;   via :k1_loud_guard=mode0|1. REVERT = delete this -D line.
    -DK1_LOUD_GUARD_V1
    ; ── Audio-freeze guard / N2 (2026-06-26) ─────────────────────────────────
    ;   Bounded I2S read (degrade-to-silence on mic/DMA stall) + task watchdog
    ;   (audio loopTask + render led_task subscribed; 5 s timeout). Default ON in
    ;   production; REVERT = delete this -D line (restores portMAX_DELAY blocking
    ;   read + un-watchdogged tasks, byte-identical pre-N2 behaviour).
    -DK1_AUDIO_FREEZE_GUARD_V1   ; N2: bounded I2S read + task watchdog (freeze-fix)
    ; ── ACF work-spreading / N2 root-fix (2026-06-30) ─────────────────────────
    ;   Amortises the ACF lag sweep across frames (16 lags/emit) so no single AP
    ;   frame pays the whole cost — the root-cause cure for the over-budget loop the
    ;   freeze guard above only CATCHES. DEVICE-PROVEN at 12.8k/96 (main K1 F887A500,
    ;   silent A/B): active p95 9088us->6784us, frames over the 7.5ms budget
    ;   889/2667->0; 127 BPM lock preserved (100%, conf 0.987). REVERT = delete this
    ;   -D line (restores one-shot ACF). Keep K1_TEMPO_ACF_REFRESH_DECIMATION=1.
    -DK1_TEMPO_ACF_SPREAD_V1=1
    ; ── Per-band AGC / N6 perceptual "louder->dimmer" fix (2026-06-30) ─────────
    ;   Each perceptual band (BASS/LOW_MID/HI_MID/TREBLE) rides its own AGC gain
    ;   instead of one global scalar that collapses the whole field on a loud
    ;   broadband hit. DEVICE-PROVEN under loud music (main K1, TOOL - Lateralus):
    ;   broadband clamps all 4 bands to one gain (cross-band spread 0.000); per-band
    ;   holds treble ~2.6x brighter than bass (spread median 0.145, up to 0.45) —
    ;   the documented 2026-06-21 "louder->dimmer" defect, measurably fixed. Look
    ;   change; REVERT = delete this -D line (restores single-scalar broadband AGC).
    -DK1_AGC_PERBAND_V1=1
    ; ── Boot-loop guard / N2b (2026-06-27; production-ON 2026-07-01) ──────────
    ;   RTC_NOINIT crash-streak counter (magic+version validity guard). 4 consecutive
    ;   CRASH reboots (panic/WDT/brownout; benign USB/SW/EXT resets are NOT counted)
    ;   before a 10 s stable uptime -> non-destructive safe mode: load_config() boots
    ;   compiled defaults IN RAM ONLY (config file is NEVER deleted or overwritten).
    ;   PRODUCTION-ON: flag-ON normal boot is device-proven on main K1 F887A500
    ;   (reset-reason classifier benign-not-counted + stable_clear, zero render/boot
    ;   regression); trip logic is host-proven (oracle_k1_bootloop golden); the failure
    ;   mode is FAIL-SAFE (a trip that never fired would merely behave as flag-OFF, no
    ;   harm). Full 4-fault trip-proof is a BENCH (B489A500) confirmation via
    ;   env:k1_bootloop_inject_probe. REVERT = delete this -D line (byte-identical pre-N2b).
    -DK1_BOOTLOOP_GUARD_V1   ; N2b: boot-loop guard (anti-brick) — production-ON
    ; ── Palette-resolution lane (2026-06-11) ───────────────────────────────────
    ;   Item 2 (K1_PALETTE_ENERGY_EXCURSION_V1) was implemented, MEASURED with
    ;   the palette-coverage gate, and NOT enabled: host A/B on bloom/beat-pulse
    ;   showed palette-dependent results (palette 7 entropy 0.18→1.51 bits, but
    ;   palette 3 distinct colours 48→25). Code stays ifdef'd in
    ;   palette_chroma_colour for future tuning against the gate.
    ; ── K1 Palette Vibrancy / palette-coordinate collapse fix (2026-07-02) ─────
    ;   Device-proven collapse chain on main K1 F887A500: loud/dense music ->
    ;   AGC+loud-guard attenuate GDFT -> chroma flatness sinks into the sparseness
    ;   gate band (live capture: flatness 0.051-0.150, one full gate-ZERO on real
    ;   music, post-gate chroma <=0.13) -> palette centroid weak -> held-hue hard
    ;   freeze -> every palette renders a handful of auto-shift-swept colours.
    ;   Fix, two levers, both ifdef K1_PALETTE_VIBRANCY_V1:
    ;   (1) palette-coordinate engine reads the POST-normalize PRE-gate chromagram
    ;       (gate keeps protecting chromatic-mode summing; quiet guard preserves
    ;       the 2026-06-11 silence hold), and
    ;   (2) weak-centroid blends held anchor toward the live centroid
    ;       (strength/0.08) instead of hard-freezing — never snaps to dominant
    ;       bin 0 (dark-start crush stays fixed).
    ;   REVERT = delete this -D line (byte-identical pre-vibrancy).
    -DK1_PALETTE_VIBRANCY_V1

; Stage 4 (2026-05-24) note: tried adding -Wno-volatile to silence the single
; C++20 [-Wvolatile] warning at system.h:48 (function_hits[id]++). Side effect:
; GCC emits "command-line option '-Wno-volatile' is valid for C++/ObjC++ but not
; for C" for every C TU in FastLED/IDF, replacing 1 warning with 35. PIO does not
; expose a clean C++-only flag channel in build_flags. Leaving the single warning
; in place — system.h edit is out of migration scope per Captain.

; Dropped from arduino-cli K1_FLAGS (RMT4-era; no-ops or anti-patterns on RMT5):
;   FASTLED_RMT_BUILTIN_DRIVER=0   FASTLED_RMT_MAX_CHANNELS=4
;   FASTLED_RMT_MAX_TICKS_FOR_GTX_SEM=100   FASTLED_ESP32_FLASH_LOCK=0
;   FASTLED_INTERRUPT_RETRY_COUNT=0

lib_deps =
    fastled/FastLED@3.10.3
    file://libraries/FixedPoints
    file://libraries/M5ROTATE8

[env:k1_bench_reference]
; Production build for the bench-reference GPIO pin map. This belongs on the
; 2nd bench K1 only: /dev/tty.usbmodem12201, USB serial B4:3A:45:A5:89:B4,
; chip B489A500. No harness/trace/dev instrumentation is enabled here.
extends = env:k1_hardware
upload_port   = /dev/tty.usbmodem12201
monitor_port  = /dev/tty.usbmodem12201
build_unflags =
    ${env:k1_hardware.build_unflags}
build_flags =
    ${env:k1_hardware.build_flags}
    -DK1_BENCH_REFERENCE_PINMAP=1

; ─────────────────────────────────────────────────────────────────────────────
; IM73D122 PDM BENCH REFERENCE (promoted to reference hardware 2026-07-15)
; (B489A500 / USB serial B4:3A:45:A5:89:B4 / port identity must be verified live).
; Runs the live production AP+VP on the bench LED pin map. Physically requires the
; IM73D122 on GPIO12(DIN)/13(CLK)/14(LR). `k1_bench_reference` remains only as a
; legacy SPH-compatible bench base.
; Flash: pio run -e k1_bench_im73d -t upload --upload-port <verified B489A500 port>
[env:k1_bench_im73d]
extends = env:k1_bench_reference
build_flags =
    ${env:k1_bench_reference.build_flags}
    -DK1_MIC_IM73D_PDM_V1

; DSR_16S evaluation build - radio-free bench IM73D only.
; Same firmware path as k1_bench_im73d, with the PDM decimation mode explicitly
; switched to I2S_PDM_DSR_16S for the +2 dB SNR measurement lane. Do not use for
; BLE/demo work and do not promote without the raw/pre-conditioning evidence gate.
[env:k1_bench_im73d_dsr16]
extends = env:k1_bench_im73d
build_flags =
    ${env:k1_bench_im73d.build_flags}
    -DK1_MIC_IM73D_DSR_16S_V1

; ─────────────────────────────────────────────────────────────────────────────
; WB-3 STM PRODUCER + EDGEMIXER MODES 7-8 (2026-07-10) — NON-SHIPPABLE, BENCH K1
; ONLY (B489A500 / IM73D122 PDM). Extends the IM73D PDM bench build with -DK1_STM,
; which compiles in the Core-0 spectral-temporal-modulation producer (k1_stm.*) and
; the EdgeMixer audio-reactive modes STM_DUAL(7) / STM_SPECTRAL_MAP(8). k1_hardware
; and k1_bench_reference stay byte-identical (K1_STM undefined). This is the
; hardware A/B lane for the STM modes on the live IM73D mic.
; REVERT = delete this env block + the k1_bench_im73d_stm guard entry.
; Flash: pio run -e k1_bench_im73d_stm -t upload --upload-port <verified B489A500 port>
[env:k1_bench_im73d_stm]
extends = env:k1_bench_im73d
build_flags =
    ${env:k1_bench_im73d.build_flags}
    -DK1_STM
; ─────────────────────────────────────────────────────────────────────────────
; IM73D122 PRODUCTION BUILD (Captain decision 2026-07-15; default environment).
; Main/product K1 GPIO map (LEDs 6/7) + K1_MIC_IM73D_PDM_V1.
; The IM73D PDM pins match the bench-proven clk13/din12/LR14 map. This env is
; the existing main/prod counterpart to `k1_bench_im73d` (bench-reference LEDs
; 4/5). Captain chooses the intended env for the configured unit; do not infer
; physical hardware differences from the env names. Guard maps this env to the
; main K1 MAC. `k1_hardware` is retained as the legacy SPH-compatible base only.
[env:k1_prod_im73d]
extends = env:k1_hardware
build_flags =
    ${env:k1_hardware.build_flags}
    -DK1_MIC_IM73D_PDM_V1
; ─────────────────────────────────────────────────────────────────────────────
; WS2816C-1313 BENCH EVALUATION BUILD (2026-07-15; SPLIT GEOMETRY 2026-07-16) —
; NON-SHIPPABLE, BENCH K1 ONLY (B489A500 / port identity must be verified live).
; Radio-free IM73D bench build for the WS2816C-1313 rig: 160 physical LEDs
; forming ONE continuous 160-px PRIMARY image, fed by TWO 80-LED data inputs —
; GPIO4 (LED_DATA_PIN) = px 0–79, GPIO5 (SECONDARY_LED_DATA_PIN) = px 80–159,
; registered as two offset WS2816 controllers over the same leds_out buffer
; (LED_NEOPIXEL_X2 shape). WHY split: WS2816 is 48-bit/pixel over WS2812-timing
; NRZ (60 µs/LED) — a single 160-LED run costs 9.88 ms incl. latch (~101 Hz
; ceiling = the whole 100 FPS frame); two 80-LED halves transmit in parallel on
; separate RMT channels at 5.08 ms. Counts/canvas UNCHANGED: LED_COUNT_VALUE=160,
; NATIVE_RESOLUTION=160, SECONDARY_LED_COUNT=160, GRB order, default current cap.
; The logical SECONDARY channel keeps rendering but has NO physical controller
; in this phase (GPIO5 is the primary's second half). PHASE 2 (only after
; Captain eyes-on PASS): secondary moves to GPIO7/8 with the same split, behind
; a K1_WS2816_1313_SECONDARY sub-flag (RMT budget then = exactly 4 of the S3's
; 4 TX channels). Local FastLED 3.10.3 `WS2816` = 48-bit emulated controller
; over WS2812 timing; GRB template param is correct (wrapper reorders once in
; 16-bit space; FastLED-side gamma/dither skipped on this path — chip is native
; 16-bit with internal gamma).
; K1_WS2816_1313_V1 gates: led_utilities.h init_leds() dual offset registration
; + init_secondary_leds() empty guard branch (MUST exist — the #else would
; stack a WS2812B controller on GPIO5). Flag-OFF → all other envs byte-identical.
; REVERT = delete this env block + the k1_bench_ws2816_1313 guard/allowlist lines
; + the K1_WS2816_1313_V1 branches in led_utilities.h + static tests.
; Bring-up: verify `:dump` CONFIG.LED_COUNT=160 first (persistence namespace is
; shared with k1_custom/k1_custom_rgbic; a stale 214/138 save halves wrongly and
; mimics a wiring fault; `:led_count default` remediates).
; Compile: scripts/agent/pio-build.sh k1_bench_ws2816_1313
; Flash: pio run -e k1_bench_ws2816_1313 -t upload --upload-port <verified B489A500 port>
[env:k1_bench_ws2816_1313]
extends = env:k1_bench_im73d
build_flags =
    ${env:k1_bench_im73d.build_flags}
    -DK1_WS2816_1313_V1
; ─────────────────────────────────────────────────────────────────────────────
; CUSTOM DUAL-214 WALL-BOUNCE BUILD (2026-07-12 overwrite of 2026-07-06 single-channel
; test bed) — NON-SHIPPABLE, BENCH K1 ONLY (B489A500 / port 12201).
; TWO independent WS2812B 5V channels of 214 LEDs each (primary GPIO4, secondary
; GPIO5) — same topology as production, bare bulbs (no LGP). Viewer sees light
; bounced off a white wall, not the dies → per-pixel detail is invisible, so the
; 160-px render canvas is RESAMPLED onto 214 by scale_to_strip() /
; scale_to_secondary_strip() (same path as strip-modes 61/91/160). NATIVE_RESOLUTION
; stays 160 → NO buffer, effect, mirror, or DSP changes. Power: Captain-locked
; CONFIG.MAX_CURRENT_MA=2500 (2.5 A total @ 5 V), forced at boot over persisted
; saves. Extends k1_bench_im73d_ble → IM73D PDM mic + NimBLE BLE-MIDI (K718 Remoted).
; K1_CUSTOM_LED_V1 gates: config_types.h LED_COUNT_VALUE=214; globals.h
; SECONDARY_LED_COUNT=214; globals_config.cpp + system.h MAX_CURRENT_MA=2500;
; led_utilities.h primary lerp-params upsample clamp + lerp_led_16 secondary clamp.
; Flag-OFF → k1_hardware / k1_bench_reference / k1_bench_im73d byte-identical.
; REVERT = delete this env block + the k1_custom line in k1_device_identities.json +
; the K1_CUSTOM_LED_V1 guards (config_types.h, globals.h, globals_config.cpp,
; system.h, led_utilities.h).
; Flash: pio run -e k1_custom -t upload --upload-port <verified B489A500 port>
[env:k1_custom]
extends = env:k1_bench_im73d_ble
build_flags =
    ${env:k1_bench_im73d_ble.build_flags}
    -DK1_CUSTOM_LED_V1
; ─────────────────────────────────────────────────────────────────────────────
; CUSTOM 12V 5050 DUAL-CHANNEL BUILD (2026-07-12) — NON-SHIPPABLE, BENCH K1 ONLY
; (B489A500 / port 12201). NOT the K1 product: a custom rig that swaps the two
; WS2812B channels (2x 160) for TWO 138-LED addressable 12V 5050 strips.
; CHIP/DRIVER (RESOLVED + EYES-ON PASS 2026-07-12): the strip is driven with
; FastLED **WS2812B, 800 kbps 250ns/750ns, RGB order** — an EXACT match to the
; Captain's proven Pixelblaze config (LED type WS2812/SK6812/NeoPixel, 800 Kbps,
; Color Order RGB; screenshot on file). EARLIER DEAD-ENDS (do not reintroduce):
; APA102/clocked-SPI (garbled from px0 — wrong protocol) and FastLED's WS2815
; chipset (wrong 250/750 timing). The reel is labelled "WS2815 / Data+CLK", but the
; DATA protocol is plain WS2812 800 kbps; the strip's second ("CLK") wire is driven
; with the SAME data (see led_utilities.h) so the real DIN always gets a valid
; signal. **ROOT CAUSE of the whole corruption saga = MISSING COMMON GROUND:** the
; strip runs off an external 12V PSU; its GND MUST be tied to the ESP32-S3 GND or
; the data has no shared reference and reads as garbage. 3.3V logic may still be
; marginal into a 12V strip — a 3.3->5V shifter (74AHCT125) on DATA/CLK is the
; backup if any sparkle remains.
; WIRING (bench-reference GPIO map, inherited): DATA pins UNCHANGED from the bench
; K1 — primary GPIO4, secondary GPIO5. Second ("CLK") wire driven with mirrored
; data: primary GPIO7, secondary GPIO8 (GPIO8 was RNG_SEED_PIN, dead/never-read;
; reassigned under flag).
; K1_CUSTOM_RGBIC_V1 gates: config_types.h LED_COUNT_VALUE=138; globals.h
; SECONDARY_LED_COUNT=138; constants.h clock-pin macros; led_utilities.h the two
; addLeds<> registrations. NATIVE_RESOLUTION stays 160 → scale_to_strip()
; downsamples 160→138 on BOTH channels (the existing 61/91 down-scale path; the
; secondary lerp branch at led_utilities.h:2203 already handles count != 160).
; Both channels stay INDEPENDENT (primary + secondary), exactly as the bench K1.
; Extends k1_bench_im73d_ble → inherits the IM73D PDM mic + NimBLE BLE-MIDI central
; so the K718 "Remoted" dial drives the rig live, same base as k1_custom.
; Flag-OFF → k1_hardware / k1_bench_reference / k1_bench_im73d / k1_custom all
; byte-identical. REVERT = delete this env block + the k1_custom_rgbic line in
; k1_upload_guard.py manifest + the K1_CUSTOM_RGBIC_V1 guards (config_types.h,
; constants.h, globals.h, led_utilities.h).
; Flash: pio run -e k1_custom_rgbic -t upload --upload-port <verified B489A500 port>
[env:k1_custom_rgbic]
extends = env:k1_bench_im73d_ble
build_flags =
    ${env:k1_bench_im73d_ble.build_flags}
    -DK1_CUSTOM_RGBIC_V1
; ─────────────────────────────────────────────────────────────────────────────
; IM73D + BLE-MIDI DEMO BUILD (2026-07-04) — NON-SHIPPABLE, BENCH K1 ONLY
; (B489A500 / USB serial B4:3A:45:A5:89:B4 / port 12201). The INVESTOR-DEMO
; amalgamation: bench K1 running the IM73D122 PDM mic on the LIVE production AP+VP,
; PLUS the NimBLE BLE-MIDI central so the K718 "Remoted" dial drives it live
; (NimBLE notify -> k1_ble_midi_decode -> k1_control_apply() -> CONFIG.*).
; Composes the bench+IM73D base (k1_bench_im73d) with ONLY the 3 BLE deltas from
; k1_ble_remoted_probe. It does NOT extend the harness -> ZERO diag/trace surfaces;
; k1_hardware / k1_bench_reference / k1_bench_im73d stay byte-identical.
;
; SEPARATE FROM THE IM73D EVAL/TUNING WORKSTREAM (Captain, 2026-07-04): this is a
; DEMO build, not a MEASUREMENT build. Do NOT take mic SNR/tuning numbers here —
; the BLE central runs a Core-0 task (ble_remoted_central.cpp:229) alongside the
; hard-real-time audio pipeline, and the 2.4 GHz interference A/B is still open, so
; radio load can perturb audio timing. Use radio-free k1_bench_im73d to measure.
;
; K718-SIDE DEPENDENCY (not delivered by this env): the K718 BLE-MIDI PERIPHERAL
; sketch is protocol-source-matched byte-exact (svc 03B80E5A-EDE8-..., "SpectraSynq
; Remoted", all 71 map entries) BUT has never been compiled/flashed. End-to-end
; "K718 controls K1" also needs the K718 built + flashed + a live link test. This
; env only builds the K1 RECEIVER half.
;
; NON-SHIPPABLE: BLE radio present; production stays radio-free until the A/B clears.
; REVERT = delete this env block + the k1_bench_im73d_ble line in k1_upload_guard.py.
; Flash: pio run -e k1_bench_im73d_ble -t upload --upload-port <verified B489A500 port>
[env:k1_bench_im73d_ble]
extends = env:k1_bench_im73d
build_src_filter =
    ${env:k1_hardware.build_src_filter}
    +<network/ble_remoted_central.cpp>
    +<network/k1_ble_midi_decoder.cpp>
build_flags =
    ${env:k1_bench_im73d.build_flags}
    -DK1_BLE_REMOTED
lib_deps =
    ${env:k1_hardware.lib_deps}
    h2zero/NimBLE-Arduino@^2.5.0
; ─────────────────────────────────────────────────────────────────────────────
