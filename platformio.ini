; ─────────────────────────────────────────────────────────────────────────────
; EFFECT FRAMEWORK GRAFT — P1 SPINE PROBE (2026-06-18)
; Additive, flag-gated compile surface for the firmware-v3 visual effect
; framework spine ported into K1 under clean names
; (SPECTRASYNQ_K1_FIRMWARE/effects/framework/*). This env compiles the new
; framework headers + the two primitive TUs + a compile-probe TU that
; instantiates every ported type, behind -DK1_EFFECT_FRAMEWORK_V1.
;
; The shipping k1_hardware env does NOT define K1_EFFECT_FRAMEWORK_V1 and does
; NOT include effects/framework/*.cpp in its build_src_filter, so the production
; firmware is byte-unchanged. Nothing in the K1 render path calls the framework
; yet (P2 = audio + CRGB16 buffer adapters; P3 = render-path wiring).
; NON-SHIPPABLE: P1 compile-surface witness only. Not production firmware.
; Compile only: pio run -e k1_effect_framework
[env:k1_effect_framework]
extends = env:k1_hardware
build_src_filter =
    ${env:k1_hardware.build_src_filter}
    +<effects/framework/RenderPrimitives.cpp>
    +<effects/framework/FrameBlend.cpp>
    +<effects/framework/LegacyEffectAdapter.cpp>
    +<effects/framework/TransitionEngine.cpp>
    +<effects/framework/TransitionOverlay.cpp>
    +<effects/framework/ZoneComposer.cpp>
    +<effects/framework/framework_compile_probe.cpp>
    +<effects/framework/zone_composer_compile_probe.cpp>
    +<director/beat_aware_director.cpp>
extra_scripts =
    pre:scripts/platformio/k1_src_includes.py
    pre:scripts/platformio/k1_effect_framework_includes.py
    pre:scripts/platformio/k1_upload_guard.py
build_flags =
    ${env:k1_hardware.build_flags}
    -DK1_EFFECT_FRAMEWORK_V1

; ─────────────────────────────────────────────────────────────────────────────
; EFFECT REGISTRY FOUNDATION — R1 (2026-06-19)
; Additive, flag-gated. Extends k1_effect_framework with the single append-only
; EffectEntry[] registry table + lookup API + a link-witness probe, plus the 5
; ported native v3 effect TUs the registry binds. Behind -DK1_EFFECT_REGISTRY_V1
; (which itself requires K1_EFFECT_FRAMEWORK_V1, inherited from the parent env).
;
; R1 is purely additive: the registry compiles + self-validates; NO consumer is
; rewired (that is R2). The shipping k1_hardware env defines NEITHER flag and does
; NOT include any of these TUs in its build_src_filter, so production firmware is
; byte-unchanged.
; NON-SHIPPABLE: R1 compile-surface witness only. Not production firmware.
; Compile only: pio run -e k1_effect_registry
[env:k1_effect_registry]
extends = env:k1_effect_framework
build_src_filter =
    ${env:k1_effect_framework.build_src_filter}
    +<effects/framework/EffectRegistry.cpp>
    +<effects/framework/effect_beat_pulse_resonant.cpp>
    +<effects/framework/effect_lgp_beat_prism.cpp>
    +<effects/framework/effect_lgp_flux_rift.cpp>
    +<effects/framework/effect_lgp_harmonic_tide.cpp>
    +<effects/framework/effect_lgp_transient_lattice.cpp>
    +<effects/framework/effect_registry_compile_probe.cpp>
build_flags =
    ${env:k1_effect_framework.build_flags}
    -DK1_EFFECT_REGISTRY_V1
