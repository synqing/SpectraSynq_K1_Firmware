    ${env:k1_hardware_harness.build_flags}
    -DK1_WIRELESS_ENABLED
    -DK1_CONTROL_TOKEN=\"k1-tab5\"   ; N3: Tab5 wireless control token — defined ONLY here (the sole wireless consumer)
