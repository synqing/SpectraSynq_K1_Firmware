[env:k1_ble_remoted_probe]
; NON-SHIPPABLE: Remoted-dial BLE-MIDI receiver, interference-A/B build only.
extends = env:k1_hardware_harness
build_src_filter =
    ${env:k1_hardware_harness.build_src_filter}
    +<network/ble_remoted_central.cpp>
    +<network/k1_ble_midi_decoder.cpp>
build_flags =
