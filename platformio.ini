; stack re-enabled — the ON condition for the interference A/B
; (scripts/regression-harness/wireless_ab_bench.py; OFF condition =
; k1_hardware_harness itself, identical surfaces minus wireless).
; NON-SHIPPABLE: bench evidence builds only. Production envs stay
; wireless-free until the A/B exonerates or convicts the stack.
; Flash: pio run -e k1_wireless_ab_probe -t upload   (port/guard inherited: 1401)
[env:k1_wireless_ab_probe]
; NON-SHIPPABLE: wireless interference A/B ON-condition build only.
extends = env:k1_hardware_harness
build_src_filter =
    ${env:k1_hardware_harness.build_src_filter}
    +<network/k1_wireless.cpp>   ; EXPLICIT: a k1_*.cpp glob would wrongly drag in k1_ble_midi_decoder.cpp
