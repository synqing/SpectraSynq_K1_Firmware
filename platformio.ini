; GDFT probe ONLY (ENABLE_GDFT_HARNESS). NON-SHIPPABLE, dev-only, bench GPIO map
; (B489A500 / 12201). Runs the deterministic rounded-k centre test on the bench.
; Flash: pio run -e k1_bench_reference_harness -t upload --upload-port /dev/tty.usbmodem12201
[env:k1_bench_reference_harness]
; NON-SHIPPABLE: internal bench GDFT probe only. Must not be distributed as production firmware.
; MabuTrace is forbidden in this env; use k1_hardware_trace_dev if timeline causality needs it.
extends = env:k1_bench_reference
build_flags =
    ${env:k1_bench_reference.build_flags}
    -DENABLE_GDFT_HARNESS=1

; ─────────────────────────────────────────────────────────────────────────────
; HARNESS BUILD (2026-05-25): k1_hardware + flag-gated AP/VP evidence surfaces.
; Used ONLY for hardware-gate capture sessions (docs/k1-refactor-2026-05/
; 03-hardware-gate-package.md §1.1). Inherits the full release env unchanged and
; appends the three evidence-surface flags. Release builds (k1_hardware) keep
; these OFF → zero hot-path cost; baseline-envelope.json is measured release-env.
; The guarded machinery lands in pre-freeze commits (§2.1 items 4–6); until then
; these flags are inert no-ops, so this env builds identically to k1_hardware.
; Flash: pio run -e k1_hardware_harness -t upload --upload-port /dev/tty.usbmodem2101
[env:k1_hardware_harness]
; NON-SHIPPABLE: internal harness only. Must not be distributed as production firmware.
; MabuTrace is forbidden in this env; use k1_hardware_trace_dev if timeline causality needs it.
extends = env:k1_hardware
build_src_filter =
    ${env:k1_hardware.build_src_filter}
    +<diag/diagnostic_capture.cpp>
    +<diag/k1_pin_evidence.cpp>
    +<diag/vpab_capture.cpp>
build_flags =
    ${env:k1_hardware.build_flags}
    -DENABLE_VP_PERF_AUDIT=1
    -DENABLE_AP_STREAM=1
    -DENABLE_FRAME_DUMP=1
    -DENABLE_VP_PROBE_CMD=1
    -DENABLE_GDFT_HARNESS=1
    -DENABLE_DIAG_CAPTURE=1
    -DENABLE_VPAB_PROBE=1
    -DK1_PIN_EVIDENCE_V1

; ─────────────────────────────────────────────────────────────────────────────
