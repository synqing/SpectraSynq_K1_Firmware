<!doctype html>
<html><head><meta charset="utf-8"><title>B489 bench wiring — mic fix + PCM1808 line-in</title>
<style>
  body{margin:0;background:#0f1115;font-family:-apple-system,Helvetica,Arial,sans-serif;color:#e8e8e8}
  .wrap{width:1400px;height:950px;position:relative}
  h1{font-size:26px;margin:0;padding:22px 32px 4px}
  .sub{font-size:16px;color:#a9b0bb;padding:0 32px}
  text{font-family:-apple-system,Helvetica,Arial,sans-serif}
</style></head>
<body><div class="wrap">
<h1>Bench K1 (B489) — fix the mic, then add the 5 line-in wires</h1>
<div class="sub">ESP32-S3-DevKitC-1, left header (J1), USB sockets at the bottom. Pin numbers count from the top. Only the coloured pins are used.</div>
<svg width="1400" height="870" viewBox="0 0 1400 870" xmlns="http://www.w3.org/2000/svg">
  <!-- DevKitC J1 header -->
  <rect x="40" y="20" width="300" height="800" rx="10" fill="#1b1f27" stroke="#3a4150"/>
  <text x="190" y="50" text-anchor="middle" font-size="20" font-weight="700">DevKitC-1 · header J1</text>
  <text x="190" y="805" text-anchor="middle" font-size="15" fill="#a9b0bb">▼ USB-C sockets this end ▼</text>
  <g id="pins" font-size="17">
    <!-- y = 80 + (n-1)*31 -->
    <g><circle cx="300" cy="80" r="9" fill="#e5484d"/><text x="70" y="86">1</text><text x="110" y="86" font-weight="700">3V3</text></g>
    <g><circle cx="300" cy="111" r="7" fill="#555"/><text x="70" y="117" fill="#777">2</text><text x="110" y="117" fill="#777">3V3</text></g>
    <g><circle cx="300" cy="142" r="7" fill="#555"/><text x="70" y="148" fill="#777">3</text><text x="110" y="148" fill="#777">RST</text></g>
    <g fill="#777"><circle cx="300" cy="173" r="7" fill="#555"/><text x="70" y="179">4</text><text x="110" y="179">GPIO4</text></g>
    <g fill="#777"><circle cx="300" cy="204" r="7" fill="#555"/><text x="70" y="210">5</text><text x="110" y="210">GPIO5</text></g>
    <g fill="#777"><circle cx="300" cy="235" r="7" fill="#555"/><text x="70" y="241">6</text><text x="110" y="241">GPIO6</text></g>
    <g fill="#777"><circle cx="300" cy="266" r="7" fill="#555"/><text x="70" y="272">7</text><text x="110" y="272">GPIO7</text></g>
    <g fill="#777"><circle cx="300" cy="297" r="7" fill="#555"/><text x="70" y="303">8</text><text x="110" y="303">GPIO15 (LED)</text></g>
    <g fill="#777"><circle cx="300" cy="328" r="7" fill="#555"/><text x="70" y="334">9</text><text x="110" y="334">GPIO16 (LED)</text></g>
    <g fill="#777"><circle cx="300" cy="359" r="7" fill="#555"/><text x="70" y="365">10</text><text x="110" y="365">GPIO17 (LED)</text></g>
    <g fill="#777"><circle cx="300" cy="390" r="7" fill="#555"/><text x="70" y="396">11</text><text x="110" y="396">GPIO18 (LED)</text></g>
    <g fill="#777"><circle cx="300" cy="421" r="7" fill="#555"/><text x="70" y="427">12</text><text x="110" y="427">GPIO8</text></g>
    <g fill="#777"><circle cx="300" cy="452" r="7" fill="#555"/><text x="70" y="458">13</text><text x="110" y="458">GPIO3</text></g>
    <g fill="#777"><circle cx="300" cy="483" r="7" fill="#555"/><text x="70" y="489">14</text><text x="110" y="489">GPIO46</text></g>
    <g><circle cx="300" cy="514" r="9" fill="#3e9bff"/><text x="70" y="520">15</text><text x="110" y="520" font-weight="700">GPIO9</text></g>
    <g><circle cx="300" cy="545" r="9" fill="#46c07a"/><text x="70" y="551">16</text><text x="110" y="551" font-weight="700">GPIO10</text></g>
    <g><circle cx="300" cy="576" r="9" fill="#f0b429"/><text x="70" y="582">17</text><text x="110" y="582" font-weight="700">GPIO11</text></g>
    <g fill="#777"><circle cx="300" cy="607" r="7" fill="#555"/><text x="70" y="613">18</text><text x="110" y="613">GPIO12 (leave free)</text></g>
    <g><circle cx="300" cy="638" r="9" fill="#c77dff"/><text x="70" y="644">19</text><text x="110" y="644" font-weight="700">GPIO13</text></g>
    <g><circle cx="300" cy="669" r="9" fill="#ff8fab"/><text x="70" y="675">20</text><text x="110" y="675" font-weight="700">GPIO14</text></g>
    <g><circle cx="300" cy="700" r="9" fill="#ff6b35"/><text x="70" y="706">21</text><text x="110" y="706" font-weight="700">5V</text></g>
    <g><circle cx="300" cy="731" r="9" fill="#bbbbbb"/><text x="70" y="737">22</text><text x="110" y="737" font-weight="700">G (ground)</text></g>
  </g>

  <!-- Mic board plug -->
  <rect x="900" y="40" width="460" height="345" rx="10" fill="#1b1f27" stroke="#3a4150"/>
  <text x="1130" y="72" text-anchor="middle" font-size="20" font-weight="700">Mic board (dual IM69D130) · 6-pin plug J1</text>
  <g font-size="17">
    <circle cx="940" cy="110" r="9" fill="#e5484d"/><text x="960" y="116">1  3.3 V in</text>
    <circle cx="940" cy="150" r="9" fill="#bbbbbb"/><text x="960" y="156">2  Ground</text>
    <circle cx="940" cy="190" r="9" fill="#ff8fab"/><text x="960" y="196">3  CLK</text>
    <circle cx="940" cy="230" r="7" fill="#555"/><text x="960" y="236" fill="#999">4  Ground — NOT data</text>
    <circle cx="940" cy="270" r="11" fill="#c77dff" stroke="#fff" stroke-width="2"/><text x="960" y="276" font-weight="700">5  DATA  ← the GPIO13 wire goes HERE</text>
    <circle cx="940" cy="310" r="7" fill="#555"/><text x="960" y="316" fill="#999">6  Ground — NOT data</text>
  </g>
  <text x="1130" y="344" text-anchor="middle" font-size="15" fill="#ffb4b4">Measured today: the GPIO13 wire sits at 0 V and never moves.</text>
  <text x="1130" y="364" text-anchor="middle" font-size="15" fill="#ffb4b4">So it is on pin 4 or 6, or pin 1 is not getting 3.3 V.</text>

  <!-- PCM1808 module -->
  <rect x="900" y="420" width="460" height="400" rx="10" fill="#1b1f27" stroke="#3a4150"/>
  <text x="1130" y="452" text-anchor="middle" font-size="20" font-weight="700">Line-in board (PCM1808, 3.5 mm jack)</text>
  <g font-size="17">
    <circle cx="940" cy="500" r="9" fill="#ff6b35"/><text x="960" y="506">VCC / 5V</text>
    <circle cx="940" cy="545" r="9" fill="#bbbbbb"/><text x="960" y="551">GND</text>
    <circle cx="940" cy="590" r="9" fill="#f0b429"/><text x="960" y="596">BCK  (bit clock)</text>
    <circle cx="940" cy="635" r="9" fill="#3e9bff"/><text x="960" y="641">LRCK  (may say LRC or WS)</text>
    <circle cx="940" cy="680" r="9" fill="#46c07a"/><text x="960" y="686">DOUT  (may say OUT or DATA)</text>
    <text x="940" y="730" fill="#a9b0bb">SCK / MCLK: leave empty.</text>
    <text x="940" y="758" fill="#a9b0bb">Solder pad OP2 bridged (48 kHz), OP1 + OP3 open —</text>
    <text x="940" y="782" fill="#a9b0bb">same as the 7 Sep line-in module.</text>
  </g>

  <!-- wires: mic -->
  <path d="M309,80 C600,80 650,110 931,110" stroke="#e5484d" stroke-width="4" fill="none"/>
  <path d="M309,731 C520,760 640,170 931,150" stroke="#bbbbbb" stroke-width="3" fill="none" stroke-dasharray="8 6"/>
  <path d="M309,669 C560,669 640,190 931,190" stroke="#ff8fab" stroke-width="4" fill="none"/>
  <path d="M309,638 C580,630 660,270 929,270" stroke="#c77dff" stroke-width="5" fill="none"/>
  <!-- wires: PCM -->
  <path d="M309,700 C600,700 650,500 931,500" stroke="#ff6b35" stroke-width="4" fill="none"/>
  <path d="M309,731 C600,740 650,545 931,545" stroke="#bbbbbb" stroke-width="4" fill="none"/>
  <path d="M309,576 C600,576 650,590 931,590" stroke="#f0b429" stroke-width="4" fill="none"/>
  <path d="M309,514 C600,514 650,635 931,635" stroke="#3e9bff" stroke-width="4" fill="none"/>
  <path d="M309,545 C600,545 650,680 931,680" stroke="#46c07a" stroke-width="4" fill="none"/>
  <text x="560" y="852" text-anchor="middle" font-size="15" fill="#a9b0bb">Dashed grey: the mic ground may use any G pin (J1-22, or J3-1/21/22 on the other header).</text>
</svg>
</div></body></html>
